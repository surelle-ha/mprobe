[package]
name = "mprobe"
version = "0.1.0"
edition = "2024"
description = "Template-driven email candidate generator and SMTP mailbox probe"
license = "MIT"
keywords = ["email", "enumeration", "osint", "smtp", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
anstyle = "1.0"
clap = { version = "4.5", features = ["derive"] }
hickory-resolver = "0.25"
idna = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
